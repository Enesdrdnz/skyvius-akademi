<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyvius Akademi</title>
<meta name="description" content="Skyvius'un yeni üyeleri için otonom sistemler ve görüntü işleme eğitim platformu: haftalık videolar, görevler, atölyeler.">
<meta property="og:title" content="Skyvius Akademi">
<meta property="og:description" content="Simülasyonda başla, Jetson'da bitir. Otonom ve görüntü işleme eğitim programı.">
<meta name="theme-color" content="#050608">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050608'/%3E%3Cpath d='M6 22 16 8l10 14h-5l-5-7-5 7z' fill='%23e3121b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800;1,900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Düzen: uçuş kontrol paneli. Üstte sabit komuta çubuğu; panelde görev listesi, hafta sayfasında brifing sütunu ve yanda kontrol listesi. Tek koyu tema (marka). */
:root{
  --bg:#050608; --panel:#0b0e12; --raised:#11151b; --line:#1d232b; --line-2:#2b333d;
  --text:#e8ebf0; --muted:#8e96a2; --silver:#b8bec8;
  --red:#e3121b; --red-ink:#ff4a50; --red-wash:rgba(227,18,27,.12);
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --bar-h:58px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar-h) + 24px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--text);text-decoration-color:var(--line-2);text-underline-offset:3px}
a:hover{text-decoration-color:var(--red-ink)}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:2px}
button{font:inherit;color:inherit}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
.tag{font:500 12px/1.3 var(--mono);letter-spacing:.14em;color:var(--red-ink);text-transform:uppercase}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.hud{--c:var(--red);--l:16px;--t:2px;
  background:
   linear-gradient(var(--c),var(--c)) top left/var(--l) var(--t),linear-gradient(var(--c),var(--c)) top left/var(--t) var(--l),
   linear-gradient(var(--c),var(--c)) top right/var(--l) var(--t),linear-gradient(var(--c),var(--c)) top right/var(--t) var(--l),
   linear-gradient(var(--c),var(--c)) bottom left/var(--l) var(--t),linear-gradient(var(--c),var(--c)) bottom left/var(--t) var(--l),
   linear-gradient(var(--c),var(--c)) bottom right/var(--l) var(--t),linear-gradient(var(--c),var(--c)) bottom right/var(--t) var(--l);
  background-repeat:no-repeat}

/* Komuta çubuğu */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,6,8,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:20px;min-height:var(--bar-h)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{display:block;width:118px;height:auto}
.brand span{font:italic 800 19px/1 var(--display);letter-spacing:.06em;color:var(--red-ink);border-left:1px solid var(--line-2);padding-left:12px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font:500 14px/1 var(--body);padding:10px 11px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line-2);flex:none}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 12px;font:600 13px/1 var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}

main{min-height:70vh}
.view{padding-block:32px 24px}

/* Panel */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start;padding-bottom:28px;border-bottom:1px solid var(--line)}
.hero-txt{display:grid;gap:16px;align-content:start}
.hero h1{margin:0;font:italic 900 clamp(40px,6.4vw,76px)/.92 var(--display);letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{font-style:inherit;color:var(--red-ink)}
.hero .lead{margin:0;max-width:60ch;color:var(--silver);font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.facts li{border:1px solid var(--line-2);padding:7px 10px;font:500 12.5px/1 var(--mono);color:var(--muted)}
.facts b{color:var(--text);font-weight:500}
.next{padding:22px;background-color:var(--panel);display:grid;gap:14px}
.next .eyebrow{display:flex;justify-content:space-between;gap:10px;font:500 12px/1.2 var(--mono);letter-spacing:.12em;color:var(--muted)}
.next .eyebrow b{color:var(--red-ink);font-weight:500}
.next h2{margin:0;display:grid;gap:4px}
.next h2 small{font:500 15px/1 var(--mono);color:var(--silver)}
.next h2 span{font:italic 800 clamp(28px,3.4vw,38px)/1 var(--display);text-wrap:balance}
.next p{margin:0;color:var(--muted);font-size:15px}
.next p b{color:var(--text);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;text-decoration:none;border:0;padding:12px 18px;font:600 15px/1 var(--body);cursor:pointer}
.btn:hover{background:var(--red-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text)}
.btn.ghost:hover{border-color:var(--silver);background:transparent}
.btn svg{width:14px;height:14px;fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--panel);padding:10px 12px;display:grid;gap:2px}
.stats b{font:600 20px/1 var(--mono);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.meter{display:block;height:4px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--red);width:0;transition:width .3s}

.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding-block:24px;border-bottom:1px solid var(--line)}
.fcol{display:grid;gap:8px;align-content:start;min-width:0}
.fcol .h{display:grid;gap:1px}
.fcol .h b{font:700 19px/1.05 var(--display);letter-spacing:.02em}
.fcol .h span{font:400 12px/1.3 var(--mono);color:var(--muted)}
.fcell{border:1px solid var(--line-2);background:var(--panel);padding:9px 10px;font-size:13.5px;line-height:1.35;color:var(--muted);text-align:left}
.fcell b{display:block;color:var(--text);font:700 16px/1.15 var(--display);letter-spacing:.01em}
button.fcell{cursor:pointer}
button.fcell:hover{border-color:var(--silver)}
button.fcell[aria-pressed="true"]{background:var(--red-wash);border-color:var(--red)}
.gate{display:flex;align-items:center;gap:8px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.gate i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--silver);flex:none}
.gate.key i{background:var(--red);border-color:var(--red)}

.phase{padding-top:30px}
.ph-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ph-head h3{margin:0;font:italic 800 27px/1.05 var(--display)}
.ph-head .rng{font:400 12px/1 var(--mono);color:var(--muted)}
.ph-head .cnt{margin-left:auto;font:500 12px/1 var(--mono);color:var(--silver);font-variant-numeric:tabular-nums}
.ph-note{margin:10px 0 0;color:var(--muted);font-size:15px;max-width:76ch}
.skip{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:14.5px;color:var(--silver);cursor:pointer}
.skip input,.tick input{accent-color:var(--red);width:17px;height:17px;margin:0}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:26px 56px minmax(0,1fr) 120px 104px;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.row:hover{background:var(--panel)}
.row .code{font:500 15px/1 var(--mono);color:var(--silver)}
.row .main{display:grid;gap:3px;min-width:0}
.row .main b{font:700 19px/1.15 var(--display);letter-spacing:.01em}
.row .main small{font-size:13.5px;color:var(--muted)}
.row .go{justify-self:end;font:600 13.5px/1 var(--body);color:var(--muted);border:1px solid var(--line-2);padding:8px 10px;white-space:nowrap}
.row.cur{background:var(--red-wash)}
.row.cur .go{background:var(--red);border-color:var(--red);color:#fff}
.row.off{opacity:.45}
.st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--red-ink) calc(var(--p,0) * 1%),var(--line-2) 0)}
.st::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--bg)}
.row:hover .st::after,.row.cur .st::after{background:var(--panel)}
.st.ok{background:var(--red)}
.st.ok::after{width:auto;height:auto;border-radius:0;background:none!important;content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}

/* Hafta sayfası */
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;font:500 12.5px/1.4 var(--mono);color:var(--muted);margin-bottom:18px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--text)}
.wk-head{display:grid;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.wk-head .code{font:500 15px/1 var(--mono);color:var(--red-ink);letter-spacing:.08em}
.wk-head h1{margin:0;font:italic 900 clamp(36px,5.4vw,62px)/.95 var(--display);text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);padding:6px 9px;font:500 12px/1 var(--mono);color:var(--silver);display:inline-flex;gap:6px;align-items:center}
.chip.r{border-color:var(--red);color:var(--text);background:var(--red-wash)}
.sib{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.wk-prog{display:grid;gap:6px;max-width:420px}
.wk-prog span{font:500 12px/1 var(--mono);color:var(--silver);font-variant-numeric:tabular-nums}

.wk-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start;padding-top:8px}
.wk-main{display:grid;gap:0;min-width:0}
.sec{padding-block:30px;border-bottom:1px solid var(--line);display:grid;gap:16px;min-width:0}
.sec:last-child{border-bottom:0}
.sec > h2{margin:0;font:italic 800 28px/1 var(--display);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec > h2 small{font:500 12px/1 var(--mono);color:var(--muted);font-style:normal;letter-spacing:.06em}
.sec > p.lead{margin:0;color:var(--muted);max-width:68ch}

.goals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.goals li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:16.5px;max-width:70ch}
.goals li::before{content:"";width:12px;height:12px;margin-top:6px;transform:rotate(45deg);border:1.5px solid var(--red-ink)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:0;margin:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.map div{padding:14px 16px;display:grid;gap:5px;align-content:start;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.map dt{font:700 18px/1.15 var(--display);letter-spacing:.01em}
.map dd{margin:0;color:var(--muted);font-size:15px;line-height:1.45}

.note{border-left:2px solid var(--red);background:var(--panel);padding:12px 14px;color:var(--silver);font-size:15px;max-width:76ch}
.note b{color:var(--text);font-weight:600}

/* Oynatıcı */
.player{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden;border:1px solid var(--line)}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55));border:0;cursor:pointer;width:100%}
.play span{width:68px;height:68px;display:grid;place-items:center;background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%);transition:transform .15s}
.play:hover span{transform:scale(1.08)}
.play em{position:absolute;left:14px;bottom:12px;font:500 12px/1 var(--mono);font-style:normal;color:#fff;background:rgba(0,0,0,.6);padding:5px 7px}
.now{display:grid;gap:10px;padding-top:14px}
.now .meta{font:500 12px/1.3 var(--mono);color:var(--muted);letter-spacing:.06em}
.now h3{margin:0;font:700 24px/1.1 var(--display);letter-spacing:.01em}
.now p{margin:0;max-width:70ch}
.chap{list-style:none;margin:0;padding:0;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.chap li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:15px}
.chap button{background:none;border:0;padding:2px 0;text-align:left;font:500 13px/1.6 var(--mono);color:var(--red-ink);cursor:pointer}
.chap button:hover{text-decoration:underline}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.links a{color:var(--silver)}
.plist{list-style:none;margin:0;padding:0;border:1px solid var(--line);max-height:620px;overflow-y:auto;background:var(--panel)}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist li.on{background:var(--red-wash)}
.plist .grp{display:block;padding:12px 12px 8px;background:var(--bg)}
.plist .grp b{display:block;font:700 15.5px/1.2 var(--display);letter-spacing:.02em}
.plist .grp span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.pick{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;background:none;border:0;padding:9px 6px 9px 10px;text-align:left;cursor:pointer;min-width:0}
.pick img{width:84px;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.pick span{display:grid;gap:2px;font-size:13.5px;line-height:1.3;min-width:0}
.pick small{font:500 11.5px/1 var(--mono);color:var(--muted)}
.tick{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--muted);padding:8px 10px}
.tick.lbl span{white-space:nowrap}
.tick input:checked + span{color:var(--text)}

/* Talimat ve kod */
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px}
.steps > li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.steps > li::before{content:counter(s,decimal-leading-zero);font:500 13px/1.7 var(--mono);color:var(--red-ink)}
.steps > li > div{display:grid;gap:8px;min-width:0}
.steps p{margin:0;max-width:72ch}
.kodblok{border:1px solid var(--line-2);background:var(--panel);margin:0;min-width:0}
.kodblok figcaption{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);font:500 12px/1 var(--mono);color:var(--muted)}
.kodblok figcaption b{color:var(--silver);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{background:transparent;border:1px solid var(--line-2);color:var(--silver);padding:6px 9px;font:500 12px/1 var(--mono);cursor:pointer}
.copy:hover{border-color:var(--silver);color:var(--text)}
.kodblok pre{margin:0;padding:14px 16px;overflow-x:auto;font:400 13.5px/1.6 var(--mono);tab-size:4}
.kodblok code{font:inherit;background:none;color:#d9dee6}
.hljs-comment,.hljs-quote{color:#6c7684;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-literal{color:#ff6b70}
.hljs-string,.hljs-attr .hljs-string,.hljs-regexp{color:#c9d7a3}
.hljs-number,.hljs-symbol{color:#f0b36a}
.hljs-title,.hljs-title.function_,.hljs-section{color:#e8ebf0;font-weight:500}
.hljs-attr,.hljs-attribute,.hljs-name,.hljs-tag{color:#9fb7d6}
.hljs-meta,.hljs-subst,.hljs-variable,.hljs-params{color:#b8bec8}
.dl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);padding:9px 12px;font:500 14px/1 var(--body);text-decoration:none;justify-self:start}
.dl:hover{border-color:var(--red-ink)}

/* Görevler */
.task{border:1px solid var(--line-2);background:var(--panel);padding:16px 18px;display:grid;gap:10px}
.task.main{border-color:var(--red)}
.task-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.task-h .tag{color:var(--silver)}
.task.main .task-h .tag{color:var(--red-ink)}
.task p{margin:0;font-size:16.5px;max-width:72ch}
.task .tick{padding:0}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lvl{border:1px solid var(--line);background:var(--bg);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.lvl .tag{color:var(--muted)}
.lvl.l2 .tag{color:var(--silver)}
.lvl.l3 .tag{color:var(--red-ink)}
.lvl p{margin:0;font-size:15px;line-height:1.45}
.ftag{display:inline-block;font:500 10.5px/1 var(--mono);letter-spacing:.08em;border:1px solid var(--line-2);padding:3px 5px;margin-right:6px;color:var(--muted)}
.ftag.y{border-color:var(--red);color:var(--red-ink)}
.lnk{font-size:13.5px;color:var(--silver)}
.mini{display:grid;gap:6px}
.mini-h{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--muted)}
.rsm{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;background:none;border:1px solid var(--line);padding:6px;text-align:left;cursor:pointer;color:var(--text);text-decoration:none;min-width:0}
.rsm:hover{border-color:var(--line-2);background:var(--raised)}
.rsm img{width:76px;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.rsm .doc{width:76px;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--line-2);font:500 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--silver)}
.rsm span{display:grid;gap:1px;font-size:13.5px;line-height:1.3;min-width:0}
.rsm small{font:500 11px/1.2 var(--mono);color:var(--muted)}

/* Önerilen kaynaklar */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr;min-width:0}
.card .th{position:relative;aspect-ratio:16/9;background:#000;border:0;padding:0;cursor:pointer;display:block;width:100%}
.card .th img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88}
.card .th span{position:absolute;left:10px;bottom:10px;width:30px;height:30px;background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%)}
.card .th em{position:absolute;right:8px;bottom:8px;font:500 11.5px/1 var(--mono);font-style:normal;background:rgba(0,0,0,.7);color:#fff;padding:4px 6px}
.card .doc{aspect-ratio:16/9;display:grid;place-items:center;background:var(--raised);border-bottom:1px solid var(--line);font:italic 800 28px/1 var(--display);color:var(--silver);text-decoration:none;letter-spacing:.04em}
.card .bd{padding:12px 14px 14px;display:grid;gap:6px;align-content:start}
.card .meta{font:500 11.5px/1.3 var(--mono);color:var(--muted)}
.card h3{margin:0;font:700 17.5px/1.2 var(--display);letter-spacing:.01em}
.card p{margin:0;font-size:14.5px;line-height:1.45;color:var(--silver)}
.card .bd a{font-size:13.5px;color:var(--muted)}

.teslim{display:grid;gap:12px;border:1px solid var(--line-2);padding:18px;background:var(--panel)}
.teslim ul{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--silver)}
.teslim .row-b{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:24px}
.pn a{border:1px solid var(--line-2);padding:14px 16px;text-decoration:none;display:grid;gap:3px;min-width:0}
.pn a:hover{border-color:var(--silver)}
.pn a.nx{text-align:right}
.pn small{font:500 12px/1 var(--mono);color:var(--muted)}
.pn b{font:700 18px/1.2 var(--display)}

.side{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 20px);display:grid;gap:14px}
.box{border:1px solid var(--line-2);background:var(--panel);padding:16px;display:grid;gap:12px}
.box h2{margin:0;font:700 18px/1 var(--display);letter-spacing:.02em}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.chk li{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chk .tick{padding:7px 0;font-size:14.5px;color:var(--silver)}
.chk a{font:500 12px/1 var(--mono);color:var(--muted);text-decoration:none;white-space:nowrap}
.chk a.vv{display:flex;align-items:center;gap:10px;padding:7px 0;font:400 14.5px/1.3 var(--body);color:var(--silver);text-decoration:none}
.chk a.vv:hover{color:var(--text)}
.vv i{width:17px;height:17px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none;border-radius:2px}
.vv.ok i{background:var(--red);border-color:var(--red)}
.vv.ok i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.side .btn{width:100%}

/* Diğer sayfalar */
.page-h{display:grid;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.page-h h1{margin:0;font:italic 900 clamp(36px,5vw,58px)/.95 var(--display);text-wrap:balance}
.page-h p{margin:0;color:var(--muted);max-width:68ch}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:6px 18px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.list .wk{font:500 15px/1.2 var(--mono);color:var(--silver);text-decoration:none}
.list h3{margin:0;font:700 19px/1.2 var(--display)}
.list p{margin:2px 0 0;color:var(--muted);font-size:15px}
.list .meta{display:flex;gap:10px;align-items:center;font:500 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.08em}
.filt{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.filt button{background:transparent;border:1px solid var(--line-2);color:var(--muted);padding:7px 12px;font:500 13px/1 var(--mono);cursor:pointer}
.filt button[aria-pressed="true"]{border-color:var(--red);color:var(--text);background:var(--red-wash)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.topic{background:var(--bg);padding:16px;display:grid;gap:6px;align-content:start}
.topic .n{font:500 12px/1 var(--mono);color:var(--muted);display:flex;justify-content:space-between}
.topic h3{margin:0;font:700 19px/1.15 var(--display)}
.topic p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.dal{font:500 11px/1 var(--mono);letter-spacing:.08em}
.dal.ot{color:var(--silver)} .dal.gi{color:var(--red-ink)} .dal.or{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px;margin-top:20px}
.rule{border:1px solid var(--line-2);padding:16px;display:grid;gap:6px;align-content:start}
.rule h3{margin:0;font:700 19px/1.15 var(--display)}
.rule p{margin:0;color:var(--muted);font-size:15px}

.modal{border:1px solid var(--line-2);background:var(--panel);color:var(--text);padding:0;width:min(960px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
.modal::backdrop{background:rgba(0,0,0,.78)}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.m-top b{font:700 18px/1.2 var(--display);min-width:0}
.m-bd{padding:12px 14px 16px;display:grid;gap:8px}
.m-bd p{margin:0;color:var(--silver)}

footer{border-top:1px solid var(--line);margin-top:40px}
.foot{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;padding-block:24px 40px;color:var(--muted);font-size:14px}
.foot img{width:110px;height:auto;display:block;opacity:.85}
.foot .reset{background:none;border:1px solid var(--line-2);color:var(--muted);padding:7px 10px;font:500 12.5px/1 var(--mono);cursor:pointer}
.foot .reset.warn{border-color:var(--red);color:var(--text)}

@media (max-width:1020px){
  .wk-grid{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:static;order:-1;padding-top:20px}
  .side .toc{display:none}
  .player{grid-template-columns:minmax(0,1fr)}
  .plist{max-height:420px}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .bar-in{flex-wrap:wrap;gap:0 12px;padding-top:8px}
  .brand{order:1}
  .seg{order:2;margin-left:auto}
  .nav{order:3;flex-basis:100%;margin-inline:-6px}
  .lvls{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:24px 48px minmax(0,1fr) auto}
  .row .meter{grid-column:3 / span 2;grid-row:2}
  .row .go{grid-row:1;grid-column:4}
}
@media (max-width:560px){
  .flow{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:22px minmax(0,1fr) auto;gap:8px 10px}
  .row .code{grid-column:2;grid-row:1}
  .row .main{grid-column:1 / span 3;grid-row:2}
  .row .meter{grid-column:1 / span 3;grid-row:3}
  .row .go{grid-column:3;grid-row:1}
  .list li{grid-template-columns:minmax(0,1fr)}
  .pn{grid-template-columns:minmax(0,1fr)}
  .pn a.nx{text-align:left}
  .stats b{font-size:17px}
  .brand img{width:96px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  kod:{b:"Offboard ile sekiz", dil:"python", s:String.raw`import asyncio, math
from mavsdk import System
from mavsdk.offboard import PositionNedYaw

async def main():
    drone = System()
    await drone.connect(system_address="udpin://0.0.0.0:14540")
    async for durum in drone.core.connection_state():
        if durum.is_connected:
            break

    await drone.action.arm()
    await drone.offboard.set_position_ned(PositionNedYaw(0, 0, -10, 0))  # başlamadan önce bir setpoint şart
    await drone.offboard.start()
    await asyncio.sleep(8)                                              # 10 m'ye çıkmasını bekle

    A, N = 15.0, 400                     # sekizin genişliği (m), adım sayısı
    for i in range(N + 1):
        t = 2 * math.pi * i / N
        x = A * math.sin(t)                  # kuzey
        y = A * math.sin(t) * math.cos(t)    # doğu
        await drone.offboard.set_position_ned(PositionNedYaw(x, y, -10, 0))
        await asyncio.sleep(0.05)            # saniyede 20 setpoint

    await drone.offboard.stop()
    await drone.action.land()

asyncio.run(main())`},

        qos = QoSProfile(reliability=ReliabilityPolicy.BEST_EFFORT,

  kod:{b:"Durum makinesi iskeleti", dil:"python", s:String.raw`from enum import Enum, auto

class Durum(Enum):
    BEKLE = auto()
    KALKIS = auto()
    GOREV = auto()
    INIS = auto()

def yakin(a, b, esik=0.5):
    return sum((p - q) ** 2 for p, q in zip(a, b)) ** 0.5 < esik

class Gorev:
    def __init__(self, rota, irtifa=10.0):
        self.durum = Durum.BEKLE
        self.rota = rota            # [(x, y, z), ...] NED, metre
        self.irtifa = irtifa
        self.hedef_no = 0

    def adim(self, konum, arm_edildi):
        """Zamanlayıcının her turunda çağrılır, gönderilecek konum setpoint'ini döndürür."""
        if self.durum == Durum.BEKLE and arm_edildi:
            self.durum = Durum.KALKIS
        elif self.durum == Durum.KALKIS and konum[2] < -(self.irtifa - 0.5):
            self.durum = Durum.GOREV
        elif self.durum == Durum.GOREV and yakin(konum, self.rota[self.hedef_no]):
            self.hedef_no += 1
            if self.hedef_no == len(self.rota):
                self.durum = Durum.INIS

        if self.durum == Durum.KALKIS:
            return (0.0, 0.0, -self.irtifa)
        if self.durum == Durum.GOREV:
            return self.rota[self.hedef_no]
        return None   # BEKLE ve INIS'te setpoint yerine VehicleCommand gönderilir`},

  kod:{b:"Tek eksende PID denemesi", dil:"python", s:String.raw`import matplotlib.pyplot as plt

  kod:{b:"Proportional navigation ile pure pursuit", dil:"python", s:String.raw`import math

def kovala(yontem, N=3.0, dt=0.05, V=12.0):
    tx, ty, tvx, tvy = 100.0, 0.0, 0.0, 8.0     # hedef takipçinin önünden dik geçiyor (m, m/s)
    px, py = 0.0, 0.0                            # takipçinin konumu
    los = math.atan2(ty - py, tx - px)
    psi = los                                    # takipçinin yönü
    for adim in range(4000):
        tx += tvx * dt; ty += tvy * dt
        yeni_los = math.atan2(ty - py, tx - px)
        los_hizi = math.atan2(math.sin(yeni_los - los), math.cos(yeni_los - los)) / dt
        los = yeni_los
        if yontem == "pp":
            psi = los                            # burnu hedefe çevir
        else:
            psi += N * los_hizi * dt             # basit PN: dönüş = N × görüş hattı hızı
        px += V * math.cos(psi) * dt; py += V * math.sin(psi) * dt
        if math.hypot(tx - px, ty - py) < 1.0:
            return adim * dt
    return None

print("Pure pursuit:", kovala("pp"), "s")
print("PN (N=3):", kovala("pn"), "s")`},

  kod:{b:"Görüntüyü alıp tespit yayınlayan node", dil:"python", s:String.raw`import rclpy
from rclpy.node import Node
from sensor_msgs.msg import Image
from vision_msgs.msg import Detection2D, Detection2DArray, ObjectHypothesisWithPose
from cv_bridge import CvBridge
from ultralytics import YOLO

class Tespit(Node):
    def __init__(self):
        super().__init__("tespit")
        self.bridge = CvBridge()
        self.model = YOLO("best.pt")
        self.create_subscription(Image, "/kamera", self.goruntu_geldi, 10)
        self.yayin = self.create_publisher(Detection2DArray, "/tespitler", 10)

    def goruntu_geldi(self, msg):
        kare = self.bridge.imgmsg_to_cv2(msg, "bgr8")
        sonuc = self.model(kare, verbose=False)[0]
        cikti = Detection2DArray(header=msg.header)          # aynı zaman damgası
        for kutu in sonuc.boxes:
            cx, cy, w, h = kutu.xywh[0].tolist()
            d = Detection2D()
            d.bbox.center.position.x, d.bbox.center.position.y = cx, cy
            d.bbox.size_x, d.bbox.size_y = w, h
            hipotez = ObjectHypothesisWithPose()
            hipotez.hypothesis.class_id = str(int(kutu.cls))
            hipotez.hypothesis.score = float(kutu.conf)
            d.results.append(hipotez)
            cikti.detections.append(d)
        self.yayin.publish(cikti)

def main():
    rclpy.init()
    rclpy.spin(Tespit())

  kod:{b:"Sabit hız modelli Kalman filtresi", dil:"python", s:String.raw`import numpy as np

dt = 0.1
F = np.array([[1, 0, dt, 0], [0, 1, 0, dt], [0, 0, 1, 0], [0, 0, 0, 1]])   # sabit hız modeli
H = np.array([[1, 0, 0, 0], [0, 1, 0, 0]])                                 # yalnız konum ölçülüyor
Q = np.eye(4) * 0.01                                                       # model gürültüsü
R = np.eye(2) * 4.0                                                        # ölçüm gürültüsü

x = np.zeros(4)           # [x, y, vx, vy]
P = np.eye(4) * 100.0     # başlangıçta çok belirsiz

def adim(olcum):
    global x, P
    x = F @ x                                  # tahmin
    P = F @ P @ F.T + Q
    if olcum is not None:                      # ölçüm yoksa (kayıp kare) yalnız tahminle devam
        y = np.asarray(olcum) - H @ x
        S = H @ P @ H.T + R
        K = P @ H.T @ np.linalg.inv(S)
        x = x + K @ y
        P = (np.eye(4) - K @ H) @ P
    return x[:2]`},
