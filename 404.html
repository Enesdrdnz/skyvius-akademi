/* GitHub Pages bu sayfayı her bulunamayan adreste gösterir; bu yüzden bütün yollar kökten (/) başlar. Ana sayfanın renkleri ve düğmeleri. */
:root{--bg:#06080b;--ink:#f2f4f7;--mut:#a5adb9;--red:#e3121b}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 17px/1.6 'Inter',system-ui,sans-serif;padding:32px 16px}
main{width:100%;max-width:560px}
.kod{font:700 14px/1 'Saira',system-ui,sans-serif;letter-spacing:.16em;color:var(--red)}
h1{font:800 clamp(34px,8vw,52px)/1.05 'Saira',system-ui,sans-serif;margin:16px 0 14px}
p{color:var(--mut)}
nav{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
a{display:inline-flex;align-items:center;min-height:52px;padding:0 30px;border-radius:999px;text-decoration:none;font:600 16px/1 'Saira',system-ui,sans-serif;color:var(--ink);border:1.5px solid rgba(255,255,255,.4);transition:border-color .2s,background .2s}
a:hover{border-color:#fff;background:rgba(255,255,255,.05)}
a.b1{background:#fff;color:#050608;border-color:#fff;font-weight:700}
a.b1:hover{background:#d5dae2}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>

  <h1>Bu sayfa burada değil</h1>
  <p>Bağlantı eskimiş ya da adres yanlış yazılmış olabilir. Aradığın şey büyük ihtimalle aşağıdakilerden birinde.</p>
  <nav><a class="b1" href="https://akademi.skyvius.com.tr/">Skyvius Akademi</a><a href="https://skyvius.com.tr/">Ana sayfa</a></nav>
</main>
